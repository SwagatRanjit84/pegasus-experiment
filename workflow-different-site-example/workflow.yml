x-pegasus:
  apiLang: python
  createdBy: swagatranjit
  createdOn: 11-16-26T18:36:16Z
pegasus: 5.0.4
name: three-step-pipeline
replicaCatalog:
  replicas:
  - lfn: input_data.txt
    pfns:
    - site: local
      pfn: /Users/swagatranjit/Music/Research/workflow-different-site-example/input_data.txt
transformationCatalog:
  transformations:
  - name: data_processor_local
    sites:
    - name: local
      pfn: /Users/swagatranjit/Music/Research/workflow-different-site-example/processor.py
      type: installed
      arch: aarch64
      os.type: macosx
  - name: data_processor_cluster
    sites:
    - name: cluster
      pfn: /home/YOUR_USERNAME/three-step-pipeline/processor.py
      type: installed
      arch: x86_64
      os.type: linux
jobs:
- type: job
  name: data_processor_local
  id: ID0000001
  arguments:
  - Stage-A
  - input_data.txt
  - stage1_output.txt
  uses:
  - lfn: input_data.txt
    type: input
  - lfn: stage1_output.txt
    type: output
    stageOut: true
    registerReplica: true
- type: job
  name: data_processor_cluster
  id: ID0000002
  arguments:
  - Stage-B
  - stage1_output.txt
  - stage2_output.txt
  uses:
  - lfn: stage2_output.txt
    type: output
    stageOut: true
    registerReplica: true
  - lfn: stage1_output.txt
    type: input
  profiles:
    pegasus:
      runtime: 7200
- type: job
  name: data_processor_local
  id: ID0000003
  arguments:
  - Stage-C
  - stage2_output.txt
  - final_output.txt
  uses:
  - lfn: final_output.txt
    type: output
    stageOut: true
    registerReplica: true
  - lfn: stage2_output.txt
    type: input
jobDependencies:
- id: ID0000001
  children:
  - ID0000002
- id: ID0000002
  children:
  - ID0000003
